<!DOCTYPE html>
<html lang="id" dir="ltr" data-nav-layout="vertical" data-theme-mode="light" data-header-styles="light" data-menu-styles="light" data-toggled="close">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Pendaftaran Pengguna | SILAT</title>
    <meta name="description" content="Pendaftaran pengguna SILAT bagi pelaku usaha yang belum memiliki SIUP">
    <link rel="icon" href="../assets/images/brand-logos/favicon.ico" type="image/x-icon">
    <script src="../assets/js/authentication-main.js"></script>
    <link href="../assets/libs/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/styles.min.css" rel="stylesheet">
    <link href="../assets/css/icons.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: linear-gradient(135deg, #f4f8ff 0%, #eefaf6 100%);
        }

        .registration-header {
            flex: 0 0 auto;
            margin: 1rem 0 0.25rem;
            text-align: center;
        }

        .registration-logo {
            width: min(100%, 150px);
            height: 36px;
            object-fit: contain;
        }

        .registration-title {
            margin: 0.2rem 0 0;
            color: #183153;
            font-size: 1rem;
            font-weight: 700;
        }

        .registration-main {
            display: flex;
            flex: 1 0 auto;
            min-width: 0;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem 0.75rem;
        }

        .registration-panel {
            width: min(100%, 820px);
            padding: 1.15rem 1.35rem;
            border: 1px solid rgba(220, 229, 239, 0.9);
            border-radius: 0.8rem;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 6px 20px rgba(31, 51, 73, 0.07);
        }

        .registration-card-title {
            margin: 0;
            color: #183153;
            font-size: 1rem;
            font-weight: 700;
        }

        .registration-description {
            margin: 0.15rem 0 0.65rem;
            color: #6c757d;
            font-size: 0.8rem;
        }

        .registration-section + .registration-section {
            margin-top: 0.55rem;
        }

        .registration-section-title {
            margin: 0 0 0.2rem;
            padding: 0 0 0.25rem;
            border-bottom: 1px solid #e1e8f0;
            color: #285477;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .account-rows {
            margin: 0;
        }

        .account-row {
            display: grid;
            grid-template-columns: minmax(260px, 280px) minmax(0, 1fr);
            min-height: 38px;
            align-items: center;
            border-bottom: 1px solid #edf1f5;
            color: #344054;
        }

        .account-row label {
            margin: 0;
            padding: 0.25rem 0.6rem 0.25rem 0;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .required-mark {
            color: #c82333;
        }

        .account-row .form-control {
            width: 100%;
            min-width: 0;
            min-height: 32px;
            margin: 0.2rem 0;
            padding: 0.3rem 0.65rem;
            border: 1px solid #d7e0ea;
            border-radius: 0.45rem;
            background-color: #fff;
            color: #183153;
            font-size: 0.78rem;
            line-height: 1.2;
            box-shadow: inset 0 1px 2px rgba(31, 51, 73, 0.025);
        }

        .account-row .form-control:focus {
            border-color: #6fa7d1;
            box-shadow: 0 0 0 0.18rem rgba(13, 91, 153, 0.12);
        }

        .registration-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 0.65rem;
        }

        .registration-actions .btn {
            min-width: 210px;
            padding: 0.45rem 1.2rem;
            border: 0;
            border-radius: 0.5rem;
            background: #0d5b99;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(13, 91, 153, 0.18);
        }

        .registration-actions .btn:hover {
            background: #0a4f86;
        }

        .registration-status {
            min-height: 1rem;
            margin: 0.2rem 0 0;
            color: #b02a37;
            font-size: 0.75rem;
            text-align: center;
        }

        .registration-footer {
            flex: 0 0 auto;
            padding: 0.35rem 0.75rem 0.5rem;
            color: #6c757d;
            font-size: 0.72rem;
            text-align: center;
        }

        @media (max-width: 767.98px) {
            .registration-panel {
                padding: 1rem;
            }

            .account-row {
                grid-template-columns: minmax(210px, 260px) minmax(0, 1fr);
            }
        }

        @media (max-width: 575.98px) {
            .registration-header {
                margin-top: 0.7rem;
            }

            .registration-main {
                align-items: flex-start;
                padding-right: 0.65rem;
                padding-left: 0.65rem;
            }

            .account-row {
                grid-template-columns: minmax(0, 1fr);
                gap: 0.05rem;
                padding: 0.35rem 0;
            }

            .account-row label {
                padding: 0.1rem 0;
            }
        }
    </style>
</head>
<body>
    <header class="registration-header">
        <img class="registration-logo" src="../assets/images/brand-logos/SILAT-nobg-logo.png" alt="SILAT">
        <h1 class="registration-title">REGISTRASI DATA PENGGUNA</h1>
    </header>

    <main class="registration-main">
        <div class="registration-panel">
            <form id="user-registration-form" novalidate>
                <section class="registration-section" aria-labelledby="business-data-title">
                    <h3 id="business-data-title" class="registration-section-title">DATA PENDAFTARAN</h3>
                    <div class="account-row">
                        <label for="owner-name">Nama Pemilik/Perusahaan <span class="required-mark">*</span></label>
                        <input id="owner-name" name="ownerName" type="text" class="form-control" required autocomplete="organization">
                    </div>
                </section>

                <section class="registration-section" aria-labelledby="account-data-title">
                    <h3 id="account-data-title" class="registration-section-title">DATA AKUN</h3>
                    <div class="account-rows">
                        <div class="account-row">
                            <label for="user-email">Email <span class="required-mark">*</span></label>
                            <input id="user-email" name="email" type="email" class="form-control" required autocomplete="email">
                        </div>
                        <div class="account-row">
                            <label for="user-password">Password <span class="required-mark">*</span></label>
                            <input id="user-password" name="password" type="password" class="form-control" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>
                </section>

                <section class="registration-section" aria-labelledby="user-data-title">
                    <h3 id="user-data-title" class="registration-section-title">DATA PENGGUNA</h3>
                    <div class="account-rows">
                        <div class="account-row">
                            <label for="full-name">Nama Lengkap <span class="required-mark">*</span></label>
                            <input id="full-name" name="fullName" type="text" class="form-control" required autocomplete="name">
                        </div>
                        <div class="account-row">
                            <label for="mobile-phone">Nomor Telepon Seluler <span class="required-mark">*</span></label>
                            <input id="mobile-phone" name="mobilePhone" type="tel" class="form-control" required autocomplete="tel">
                        </div>
                        <div class="account-row">
                            <label for="identity-number">Nomor KTP <span class="required-mark">*</span></label>
                            <input id="identity-number" name="identityNumber" type="text" class="form-control" required inputmode="numeric" minlength="16" maxlength="16" autocomplete="off">
                        </div>
                    </div>
                </section>

                <div class="registration-actions">
                    <button type="submit" class="btn btn-primary text-white">Pendaftaran</button>
                </div>
                <p id="registration-status" class="registration-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <footer class="registration-footer">© Direktorat Jenderal Perikanan Tangkap, 2026</footer>

    <div class="modal fade" id="registration-success-modal" tabindex="-1" aria-labelledby="registration-success-title" aria-describedby="registration-success-message" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h2 class="modal-title fs-5 fw-semibold text-dark" id="registration-success-title">Pendaftaran Berhasil</h2>
                </div>
                <div class="modal-body text-muted" id="registration-success-message">
                    Silakan lakukan aktivasi akun melalui email yang telah didaftarkan.
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-primary px-4" id="registration-success-ok">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            const form = document.getElementById('user-registration-form');
            const identityInput = document.getElementById('identity-number');
            const successModalElement = document.getElementById('registration-success-modal');
            const successModal = new bootstrap.Modal(successModalElement);

            identityInput.addEventListener('input', () => {
                identityInput.value = identityInput.value.replace(/\D/g, '').slice(0, 16);
            });

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                if (!form.reportValidity()) return;

                successModal.show();
            });

            document.getElementById('registration-success-ok').addEventListener('click', () => {
                window.location.href = 'login.html';
            });
        })();
    </script>
</body>
</html>
